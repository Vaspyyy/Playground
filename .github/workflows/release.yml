name: Test and release Playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: playground-release
  cancel-in-progress: false
jobs:
  mouse-helper:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install KDE build dependencies
        run: pacman -Syu --noconfirm --needed git cmake extra-cmake-modules vulkan-headers xorg-server-xvfb xdotool kwin python-gobject python-cairo gtk3 gtk-layer-shell mesa dbus
      - uses: actions/checkout@v4
      - name: Compile the native click bridge against current KDE
        run: |
          cmake -S playground/kwin_mouse -B /tmp/playground-mouse -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/playground-mouse --parallel 2
          cmake --install /tmp/playground-mouse
      - name: Test in virtual KDE Wayland
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          setcap -r /usr/bin/kwin_wayland
          export XDG_RUNTIME_DIR=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c 'dbus-run-session -- kwin_wayland --x11-display "$DISPLAY" --width 1280 --height 1024 --no-lockscreen --exit-with-session "python $GITHUB_WORKSPACE/playground/tests/smoke_wayland.py"' 
  release:
    needs: mouse-helper
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 xvfb dbus-x11
      - name: Test Python and renderer
        working-directory: playground
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 -m compileall -q .
          bash -n install.sh
      - name: Smoke test GTK settings
        timeout-minutes: 2
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 playground/tests/smoke_ui.py
      - name: Package release
        run: /usr/bin/python3 scripts/package.py
      - name: Publish version if new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/bin/python3 -c "import sys; sys.path.insert(0, 'playground'); from version import VERSION; print(VERSION)")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version v$VERSION is already released. Bump playground/version.py for a new release."
          else
            gh release create "v$VERSION" dist/playground.tar.gz dist/playground.tar.gz.sha256 --target "$GITHUB_SHA" --title "Playground $VERSION" --notes-file RELEASE_NOTES.md --latest
          fi
